services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: esapiens
      POSTGRES_USER: esapiens
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esapiens -d esapiens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
